name: COZY676 direct booking dates
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'hold = block dates; release = remove exact block; refresh = rebuild calendar'
        type: choice
        options: [hold, release, refresh]
        required: true
      checkin:
        description: 'Check-in YYYY-MM-DD (Korea)'
        type: string
      checkout:
        description: 'Check-out YYYY-MM-DD (Korea), not included in blocked nights'
        type: string
permissions:
  contents: write
concurrency:
  group: cozy676-direct-bookings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Update dates
        env:
          BOOKING_ACTION: ${{ inputs.action }}
          CHECKIN: ${{ inputs.checkin }}
          CHECKOUT: ${{ inputs.checkout }}
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: node scripts/direct-booking.mjs
      - name: Save calendar
        run: |
          git config user.name 'COZY676 calendar'
          git config user.email 'cozy676@users.noreply.github.com'
          git add direct-bookings.json direct-bookings.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Update direct booking date blocks'
            git push
          fi
